<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Voxify AI — Full Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="style.css"/>
</head>
<body class="dark">

<!-- SETUP MODAL -->
<div id="setupModal" class="overlay">
  <div class="setup-box">
    <div class="setup-logo">🤖</div>
    <h2>Welcome to Voxify AI</h2>
    <p>Enter your <strong>Google Gemini API key</strong> to get started.<br/>
    Stored only in your browser — never sent anywhere else.</p>
    <div class="key-row">
      <input type="password" id="apiKeyInput" placeholder="Paste Gemini API key..."/>
      <button onclick="toggleVis()" class="vis-btn" id="visBtn"><i class="fa fa-eye"></i></button>
    </div>
    <a href="https://aistudio.google.com/apikey" target="_blank" class="ext-link">
      <i class="fa fa-external-link-alt"></i> Get free key from Google AI Studio
    </a>
    <button class="start-btn" onclick="saveKey()">Launch Voxify <i class="fa fa-arrow-right"></i></button>
  </div>
</div>

<!-- APP -->
<div class="app hidden" id="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-top">
      <div class="sb-brand"><span class="sb-ico">V</span><span class="sb-name">Voxify AI</span></div>
      <button class="sb-close" onclick="closeSB()"><i class="fa fa-xmark"></i></button>
    </div>
    <nav class="sb-nav">
      <div class="nav-group-label">Main</div>
      <button class="nb active" data-s="home"       onclick="go('home')">      <i class="fa fa-house"></i>       Home</button>
      <button class="nb"        data-s="chat"       onclick="go('chat')">      <i class="fa fa-message"></i>     Chat</button>
      <button class="nb"        data-s="memory"     onclick="go('memory')">    <i class="fa fa-brain"></i>       Memory</button>
      <button class="nb"        data-s="voice"      onclick="go('voice')">     <i class="fa fa-microphone"></i>  Voice</button>
      <div class="nav-group-label">Tools</div>
      <button class="nb"        data-s="study"      onclick="go('study')">     <i class="fa fa-graduation-cap"></i> Study</button>
      <button class="nb"        data-s="coding"     onclick="go('coding')">    <i class="fa fa-code"></i>        Coding</button>
      <button class="nb"        data-s="files"      onclick="go('files')">     <i class="fa fa-folder-open"></i> Files</button>
      <button class="nb"        data-s="internet"   onclick="go('internet')">  <i class="fa fa-globe"></i>       Internet</button>
      <div class="nav-group-label">Productivity</div>
      <button class="nb"        data-s="tasks"      onclick="go('tasks')">     <i class="fa fa-list-check"></i>  Tasks</button>
      <button class="nb"        data-s="notes"      onclick="go('notes')">     <i class="fa fa-note-sticky"></i> Notes</button>
      <button class="nb"        data-s="calendar"   onclick="go('calendar')">  <i class="fa fa-calendar"></i>    Calendar</button>
      <div class="nav-group-label">More</div>
      <button class="nb"        data-s="comms"      onclick="go('comms')">     <i class="fa fa-envelope"></i>    Communication</button>
      <button class="nb"        data-s="utils"      onclick="go('utils')">     <i class="fa fa-calculator"></i>  Utilities</button>
      <button class="nb"        data-s="aitools"    onclick="go('aitools')">   <i class="fa fa-wand-magic-sparkles"></i> AI Tools</button>
      <button class="nb"        data-s="computer"   onclick="go('computer')">  <i class="fa fa-desktop"></i>     Computer</button>
      <button class="nb"        data-s="security"   onclick="go('security')">  <i class="fa fa-shield-halved"></i> Security</button>
      <button class="nb"        data-s="analytics"  onclick="go('analytics')"> <i class="fa fa-chart-bar"></i>   Analytics</button>
      <button class="nb"        data-s="settings"   onclick="go('settings')">  <i class="fa fa-gear"></i>        Settings</button>
    </nav>
    <div class="sb-footer">
      <div class="sb-status"><span class="sdot"></span><span id="statusTxt">Ready</span></div>
      <div class="sb-model" id="sbModel">gemini-3.6-flash</div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="main">
    <div class="topbar">
      <button class="tb-menu" onclick="toggleSB()"><i class="fa fa-bars"></i></button>
      <div class="tb-title" id="tbTitle"><i class="fa fa-house"></i> Home</div>
      <div class="tb-right">
        <button class="tb-btn" onclick="go('chat')" title="Quick Chat"><i class="fa fa-message"></i></button>
        <button class="tb-btn" id="themeBtn" onclick="toggleTheme()" title="Theme"><i class="fa fa-moon"></i></button>
        <button class="tb-btn" onclick="go('settings')" title="Settings"><i class="fa fa-gear"></i></button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
